[workspace]
members = [
  "tvc-secrets",
  "github-broker",
]

resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false
rust-version = "1.88"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.dependencies]
axum = { version = "0.8.8", default-features = false }
base64 = "0.22"
hex = "0.4"
hkdf = "0.12"
hpke = { version = "0.10", default-features = false, features = ["alloc", "p256"] }
p256 = { version = "0.13", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }
# RSA signing and ES256 verification. Do not use the `rsa` crate for private
# key operations (RUSTSEC-2023-0071).
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.142"
sha2 = "0.10"
zeroize = "1"
tokio = { version = "1.47", default-features = false }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["trace"] }
