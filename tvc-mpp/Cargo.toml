[package]
name = "tvc-mpp"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
axum = { version = "=0.8.8", default-features = false, features = ["http1", "tokio", "json", "original-uri"] }
base64 = "=0.22.1"
clap = { version = "=4.5.40", features = ["derive"] }
http = "=1.3.1"
qos_hex = "=0.10.0"
qos_p256 = { version = "=0.10.0", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.142"
sha2 = "=0.10.9"
tokio = { version = "=1.47.1", features = ["macros", "rt-multi-thread", "signal", "net"] }
turnkey_jwt_verify = "=0.18.0"
url = "=2.5.7"

[dev-dependencies]
p256 = { version = "=0.13.2", features = ["ecdsa"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
tower = { version = "=0.5.2", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[workspace]
