[workspace]
members = [
  "crates/metrics",
  "crates/policy-sidecar",
]

resolver = "3"

[workspace.package]
edition = "2024"
version = "0.2.0"
publish = false
rust-version = "1.94"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.dependencies]
axum = { version = "0.8.8", default-features = false }
base64 = { version = "0.22.1", default-features = false, features = ["std"] }
bcs = "0.1.6"
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std"] }
serde_json = "1.0.142"
serde = { version = "1", default-features = false }
tokio = { version = "1.47", default-features = false }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.6", features = ["trace"] }
http-body-util = "0.1"
pin-project-lite = "0.2"
prometheus = { version = "0.13", default-features = false }
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa"] }
sha3 = { version = "0.10", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
turnkey_api_key_stamper = "0.12.0"
turnkey_client = "0.12.0"
qos_core = { version = "0.10.0", default-features = false }
qos_hex = { version = "0.10.0", default-features = false }
qos_p256 = { version = "0.10.0", default-features = false }
