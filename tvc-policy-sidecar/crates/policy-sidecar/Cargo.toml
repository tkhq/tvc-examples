[package]
name = "policy-sidecar"
edition.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
axum = { workspace = true, features = ["http1", "tokio", "json", "macros"] }
base64 = { workspace = true }
bcs = { workspace = true }
ed25519-dalek = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tower-http = { workspace = true }
reqwest = { workspace = true }
metrics = { path = "../metrics" }
qos_core = { workspace = true }
qos_hex = { workspace = true }
qos_p256 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
sha3 = { workspace = true }
turnkey_api_key_stamper = { workspace = true }
turnkey_client = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
p256 = { workspace = true }
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }
