name: Build TVC Oracle image

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
    paths:
      - ".github/actions/docker-setup/**"
      - ".github/workflows/tvc-oracle-stagex.yml"
      - "tvc-oracle/**"
  pull_request:
    paths:
      - ".github/actions/docker-setup/**"
      - ".github/workflows/tvc-oracle-stagex.yml"
      - "tvc-oracle/**"
  workflow_dispatch:

jobs:
  build:
    name: Build tvc-oracle-demo image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
      packages: write
    env:
      tags: >-
        ${{ github.ref == format('refs/heads/{0}', 'main') && 'latest' || '' }}
        ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || '' }}
        ${{ github.event_name == 'push' && github.ref_name || '' }}
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Docker setup
        uses: ./.github/actions/docker-setup
        with:
          dockerHub: ${{ secrets.DOCKERHUB_API_KEY }}
          ghcr: ${{ secrets.GITHUB_TOKEN }}

      - name: Build reproducible linux/amd64 image
        working-directory: tvc-oracle
        run: make -j$(nproc) out/tvc-oracle-demo/index.json

      - name: Load artifact to Docker
        working-directory: tvc-oracle
        run: env -C out/tvc-oracle-demo tar -cf - . | docker load

      - name: Upload to GHCR
        env:
          IMAGE_NAME: tvc-oracle-demo
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          destination="ghcr.io/${owner}/${IMAGE_NAME}"
          for tag in ${tags}; do
            docker tag "tkhq-tvc-oracle-demo/tvc-oracle-demo:latest" "${destination}:${tag}"
          done
          docker image push --all-tags "${destination}"

      - name: TVC deployment details
        env:
          IMAGE_NAME: tvc-oracle-demo
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          first_tag=$(echo "${{ env.tags }}" | awk '{print $1}')
          container_url="ghcr.io/${owner}/${IMAGE_NAME}:${first_tag}"
          container_digest=$(docker inspect --format='{{index .RepoDigests 0}}' "${container_url}" | cut -d '@' -f 2)
          docker create --name tmp-extract "${container_url}" /bin/true
          docker cp tmp-extract:/tvc_app /tmp/binary
          docker rm tmp-extract
          digest=$(sha256sum /tmp/binary | awk '{print $1}')
          {
            echo "## TVC Deployment Details"
            echo ""
            echo "- **Container Image URL**: \`${container_url}@${container_digest}\`"
            echo "- **Executable path**: \`/tvc_app\`"
            echo "- **Expected Executable Digest**: \`${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"
