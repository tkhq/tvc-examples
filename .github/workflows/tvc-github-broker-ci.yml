name: TVC GitHub Broker CI

on:
  push:
    branches:
      - main
    paths:
      - "tvc-github-broker/**"
      - ".github/workflows/tvc-github-broker-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "tvc-github-broker/**"
      - ".github/workflows/tvc-github-broker-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tvc-github-broker
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@fb51252c7ba57d633bc668f941da052e410add48 # v1.13.0
        with:
          components: clippy, rustfmt
          cache-workspaces: tvc-github-broker/src
      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Run linters
        run: make -C src lint
      - name: Run Rust tests
        run: make -C src test
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Run e2e tests (local Turnkey stand-in, mock GitHub, broker)
        run: bun test tests/
